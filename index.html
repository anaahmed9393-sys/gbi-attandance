<style>
  :root{
    --navy-deep:#0A1D30;
    --navy-mid:#102941;
    --navy-card:#153552;
    --navy-card2:#1A3D5C;
    --steel:#3E5C78;
    --steel-light:#7E9DB8;
    --paper:#EFEAE0;
    --amber:#E6C047;
    --amber-deep:#B8860B;
    --green:#49B571;
    --red:#E1584B;
    --font-display:'Cairo',sans-serif;
    --font-body:'Tajawal',sans-serif;
    --font-mono:'Roboto Mono',monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      repeating-linear-gradient(135deg, rgba(255,255,255,0.015) 0 2px, transparent 2px 18px),
      linear-gradient(180deg,var(--navy-deep),#081826 60%,#061420);
    color:var(--paper);
    font-family:var(--font-body);
    min-height:100vh;
  }
  #app{max-width:720px;margin:0 auto;padding:14px 14px 60px;}
  h1,h2,h3{font-family:var(--font-display);margin:0;}
  .mono{font-family:var(--font-mono);direction:ltr;display:inline-block;}
  button{font-family:var(--font-display);cursor:pointer;border:none;}
  input,select{font-family:var(--font-body);}

  /* ---- Brand plate ---- */
  .plate{
    background:linear-gradient(160deg,var(--navy-card2),var(--navy-mid));
    border:1px solid rgba(126,157,184,.35);
    border-radius:10px;
    position:relative;
    padding:16px;
  }
  .plate::before,.plate::after,.plate .rivet-l,.plate .rivet-r{
    content:"";position:absolute;width:6px;height:6px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#cfd9e2,#6b7f92 70%);
    box-shadow:0 1px 1px rgba(0,0,0,.5);
  }
  .plate::before{top:7px;left:7px;}
  .plate::after{top:7px;right:7px;}
  .plate .rivet-l{bottom:7px;left:7px;}
  .plate .rivet-r{bottom:7px;right:7px;}

  .brand{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .brand-center{flex-direction:column;justify-content:center;text-align:center;}
  .credit-line{font-size:11px;color:var(--amber);opacity:.85;margin-top:6px;letter-spacing:.3px;}
  .footer-credit{text-align:center;color:var(--steel-light);font-size:11px;margin-top:26px;opacity:.75;}
  .brand-mark{
    font-weight:900;font-size:26px;letter-spacing:2px;color:var(--navy-deep);
    background:linear-gradient(160deg,var(--amber),var(--amber-deep));
    padding:6px 14px;border-radius:6px;
    box-shadow:0 2px 0 rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.4);
    font-family:var(--font-display);
  }
  .brand-sub{font-size:12.5px;color:var(--steel-light);margin-top:2px;}
  .clock{
    font-family:var(--font-mono);font-size:20px;letter-spacing:1px;
    background:#04101c;color:var(--amber);padding:6px 10px;border-radius:6px;
    border:1px solid rgba(230,192,71,.35);
    box-shadow:inset 0 0 8px rgba(230,192,71,.15);
    direction:ltr;
  }

  /* ---- Cards / tiles ---- */
  .card{
    background:var(--navy-card);
    border:1px solid rgba(126,157,184,.25);
    border-radius:12px;
    padding:16px;
    margin-top:14px;
  }
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px;}
  .tile{
    background:linear-gradient(160deg,var(--navy-card2),var(--navy-mid));
    border:1px solid rgba(126,157,184,.3);
    border-radius:12px;
    padding:16px 12px;
    text-align:center;
    transition:transform .12s ease, border-color .12s ease;
  }
  .tile:active{transform:scale(.97);}
  .tile:hover{border-color:var(--amber);}
  .tile .icon{font-size:26px;display:block;margin-bottom:6px;}
  .tile .t-title{font-weight:800;font-size:15px;color:var(--paper);}
  .tile .t-status{font-size:11.5px;color:var(--steel-light);margin-top:6px;line-height:1.5;}
  .tile.full{grid-column:1/-1;}

  /* ---- Buttons ---- */
  .btn{
    display:inline-block;width:100%;padding:13px 14px;border-radius:8px;
    font-weight:800;font-size:15.5px;text-align:center;
  }
  .btn-amber{background:linear-gradient(160deg,var(--amber),var(--amber-deep));color:var(--navy-deep);box-shadow:0 3px 0 #8a6a12;}
  .btn-amber:active{box-shadow:0 1px 0 #8a6a12;transform:translateY(2px);}
  .btn-red{background:linear-gradient(160deg,#ea6a5e,var(--red));color:#fff;box-shadow:0 3px 0 #a13228;}
  .btn-red:active{box-shadow:0 1px 0 #a13228;transform:translateY(2px);}
  .btn-ghost{background:transparent;border:1px solid var(--steel-light);color:var(--paper);}
  .btn-disabled{background:#233b52;color:#7f97ac;box-shadow:none;cursor:default;}

  .row{display:flex;gap:10px;}
  .row>*{flex:1;}

  .field{margin-top:10px;}
  .field label{display:block;font-size:12.5px;color:var(--steel-light);margin-bottom:5px;}
  .field input,.field select{
    width:100%;padding:11px 10px;border-radius:7px;border:1px solid rgba(126,157,184,.4);
    background:#0C233A;color:var(--paper);font-size:15px;
  }
  .field input:focus,.field select:focus{outline:2px solid var(--amber);}

  .readonly{
    background:#0C233A;border:1px dashed rgba(126,157,184,.4);border-radius:7px;
    padding:9px 10px;font-size:14px;color:var(--steel-light);
  }
  .readonly b{color:var(--paper);font-family:var(--font-mono);}

  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .link-btn{background:none;color:var(--amber);font-size:13.5px;font-weight:700;padding:4px;}
  .error{color:#ff9a8f;font-size:13px;margin-top:8px;}
  .tabs{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
  .tab{padding:8px 12px;border-radius:20px;font-size:13px;font-weight:700;background:#0C233A;color:var(--steel-light);border:1px solid rgba(126,157,184,.3);}
  .tab.active{background:var(--amber);color:var(--navy-deep);border-color:var(--amber);}

  /* ---- Ticket stub (signature element) ---- */
  .ticket{
    position:relative;margin-top:14px;padding:14px 16px;border-radius:6px;
    background:repeating-linear-gradient(135deg,#fbf3df,#fbf3df 10px,#f6ecd2 10px,#f6ecd2 20px);
    color:#3a2a10;transform:rotate(-1.2deg);
    box-shadow:0 6px 14px rgba(0,0,0,.35);
    border-top:2px dashed #b98a2f;border-bottom:2px dashed #b98a2f;
  }
  .ticket .stamp{
    position:absolute;top:8px;left:12px;border:3px solid #b23b2f;color:#b23b2f;
    border-radius:50%;width:60px;height:60px;display:flex;align-items:center;justify-content:center;
    font-family:var(--font-display);font-weight:900;font-size:11px;text-align:center;line-height:1.1;
    transform:rotate(-16deg);opacity:.85;
  }
  .ticket .t-line{font-family:var(--font-mono);font-size:14px;margin-top:3px;}
  .ticket .t-head{font-family:var(--font-display);font-weight:800;font-size:15px;margin-inline-start:70px;}
  .ticket .t-body{margin-inline-start:70px;}

  /* ---- Reports ---- */
  .report-group{margin-top:14px;border:1px solid rgba(126,157,184,.3);border-radius:12px;overflow:hidden;box-shadow:0 4px 10px rgba(0,0,0,.2);}
  .report-group h4{background:linear-gradient(160deg,var(--navy-card2),var(--navy-mid));padding:11px 14px;font-size:14px;font-weight:800;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid rgba(230,192,71,.4);}
  .table-wrap{border:1px solid rgba(126,157,184,.3);border-radius:10px;overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:10px;}
  .table-wrap table{margin:0;}
  .scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .scroll-x::-webkit-scrollbar,.table-wrap::-webkit-scrollbar{height:6px;}
  .scroll-x::-webkit-scrollbar-thumb,.table-wrap::-webkit-scrollbar-thumb{background:rgba(230,192,71,.4);border-radius:4px;}
  .scroll-x::-webkit-scrollbar-track,.table-wrap::-webkit-scrollbar-track{background:transparent;}
  table{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px;}
  table.wide{min-width:480px;}
  table.wide7{min-width:640px;}
  table.wide7 th:nth-child(5),table.wide7 td:nth-child(5){border-inline-start:2px solid rgba(230,192,71,.35);}
  .legend{font-size:11px;color:var(--steel-light);margin-top:10px;line-height:1.8;}
  .grand-total.clickable{cursor:pointer;transition:transform .12s ease;}
  .grand-total.clickable:active{transform:scale(.98);}
  thead th{background:linear-gradient(180deg,rgba(230,192,71,.14),rgba(230,192,71,.06));color:var(--amber);font-weight:800;font-size:11px;padding:10px 9px;border-bottom:2px solid rgba(230,192,71,.45);white-space:nowrap;}
  tbody td{padding:9px;border-bottom:1px solid rgba(126,157,184,.14);white-space:nowrap;}
  tbody tr:nth-child(even){background:rgba(255,255,255,.025);}
  tbody tr:hover{background:rgba(230,192,71,.06);}
  tbody tr:last-child td{border-bottom:none;}
  th,td{text-align:center;}
  td.mono,th.mono{font-family:var(--font-mono);direction:ltr;}
  tfoot td{font-weight:800;background:rgba(230,192,71,.1);color:var(--amber);border-top:1px solid rgba(230,192,71,.3);padding:9px;}

  .admin-row .adm-name{font-weight:800;font-size:13.5px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;padding-bottom:7px;border-bottom:1px solid rgba(126,157,184,.2);}

  .adm-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .adm-grid label{display:block;font-size:10.5px;color:var(--steel-light);margin-bottom:3px;}
  .adm-grid input{width:100%;padding:7px 8px;border-radius:6px;border:1px solid rgba(126,157,184,.4);background:#081a2c;color:var(--paper);font-size:13px;}
  .adm-actions{display:flex;gap:8px;margin-top:9px;}
  .adm-actions button{flex:1;padding:8px;border-radius:6px;font-size:12.5px;font-weight:800;}
  .adm-save{background:var(--green);color:#062915;}
  .adm-del{background:var(--red);color:#fff;}
  .adm-add-form{border:1px dashed rgba(230,192,71,.5);border-radius:9px;padding:12px;margin-top:12px;}
  .perm-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px;}
  .perm-btn{padding:10px 4px;border-radius:8px;font-size:11.5px;font-weight:700;line-height:1.5;text-align:center;border:1px solid transparent;}
  .perm-btn.on{background:rgba(73,181,113,.15);color:var(--green);border-color:var(--green);}
  .perm-btn.off{background:rgba(225,88,75,.15);color:var(--red);border-color:var(--red);}
  .tile-locked{opacity:.4;filter:grayscale(.5);}
  .tile-locked .t-status{color:var(--red);}
  .flag-bad{color:var(--red) !important;font-weight:700;}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px;}
  .stat-card{background:linear-gradient(160deg,var(--navy-card2),var(--navy-mid));border:1px solid rgba(230,192,71,.3);border-radius:12px;padding:18px 10px;text-align:center;}
  .stat-card.clickable{cursor:pointer;transition:transform .12s ease,border-color .12s ease;}
  .stat-card.clickable:active{transform:scale(.97);}
  .stat-card.clickable:hover{border-color:var(--amber);}
  .stat-hint{font-size:9.5px;color:var(--amber);margin-top:6px;opacity:.8;}
  .stat-icon{font-size:24px;}
  .stat-value{font-size:21px;font-weight:900;color:var(--amber);margin-top:8px;font-family:var(--font-display);}
  .stat-label{font-size:11px;color:var(--steel-light);margin-top:5px;line-height:1.4;}

  @media print{
    body{background:#fff;color:#000;}
    .no-print{display:none !important;}
    .card,.report-group{border-color:#999;background:#fff;color:#000;}
    .report-group h4{background:#eee;color:#000;}
    th{color:#333;}
    tfoot td{background:#f4dfae;color:#000;}
    .grand-total{background:#f4dfae;color:#000;}
    .letterhead{background:#fff;border-color:#999;color:#000;}
    .letterhead .lh-title,.letterhead .lh-sub,.letterhead .lh-date{color:#000;}
    .footer-credit{color:#666;}
    .flag-bad{color:#b3261e !important;}

</style>
</head>
<body>
<div id="app"></div>

<script>
/* ===================== PWA: install prompt + service worker ===================== */
let deferredInstallPrompt=null;
let installAvailable=false;
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredInstallPrompt=e;
  installAvailable=true;
  if(typeof render==='function') render();
});
window.addEventListener('appinstalled', ()=>{
  installAvailable=false;
  deferredInstallPrompt=null;
  if(typeof render==='function') render();
});
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
async function installApp(){
  if(!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt=null;
  installAvailable=false;
  render();
}

/* ===================== Constants & helpers ===================== */
const AR_DAYS = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];

function pad(n){ return String(n).padStart(2,'0'); }
function isoDate(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function dispDate(iso){ if(!iso) return '--'; const [y,m,d]=iso.split('-'); return d+'/'+m+'/'+y; }
function dayNameOf(iso){ const d=new Date(iso+'T00:00:00'); return AR_DAYS[d.getDay()]; }
function nowTimeStr(){ const d=new Date(); return pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds()); }
function shortTime(t){ return t ? t.slice(0,5) : '--:--'; }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function minutesBetween(date,t1,t2){
  const a=new Date(date+'T'+t1);
  let b=new Date(date+'T'+t2);
  if(b<a) b.setDate(b.getDate()+1);
  return Math.round((b-a)/60000);
}
function fmtHM(mins){ if(mins==null||isNaN(mins)) return '--:--'; const h=Math.floor(mins/60), m=mins%60; return h+':'+pad(m); }

/* ===================== Official work hours (8:00 - 17:00) ===================== */
const STANDARD_IN_MIN=8*60;      // 08:00
const STANDARD_OUT_MIN=17*60;    // 17:00
const STANDARD_DURATION_MIN=STANDARD_OUT_MIN-STANDARD_IN_MIN; // 9 ساعات
function timeToMinutesOfDay(t){ if(!t) return null; const p=t.split(':'); return parseInt(p[0],10)*60+parseInt(p[1],10); }
function punctualityFor(r){
  const inMin=timeToMinutesOfDay(r.checkIn);
  const outMin=timeToMinutesOfDay(r.checkOut);
  const late=(inMin!=null)? Math.max(0, inMin-STANDARD_IN_MIN) : null;
  const early=(outMin!=null)? Math.max(0, STANDARD_OUT_MIN-outMin) : null;
  const shortage=(r.minutes!=null)? Math.max(0, STANDARD_DURATION_MIN-r.minutes) : null;
  return {late,early,shortage};
}

/* ===================== State ===================== */
let employees=[], attendance=[], overtime=[], breaksArr=[];
let currentUser=null;
let ui={ screen:'login', loginMode:'login', loginError:'', section:null, lastTicket:null, report:null };

/* ===================== Storage ===================== */
async function safeGet(key){
  try{ return await window.storage.get(key,true); }catch(e){ return null; }
}
async function loadData(){
  const [e,a,o,b] = await Promise.all([
    safeGet('employees'), safeGet('attendance'), safeGet('overtime'), safeGet('breaks_records')
  ]);
  employees = e ? JSON.parse(e.value) : [];
  attendance = a ? JSON.parse(a.value) : [];
  overtime = o ? JSON.parse(o.value) : [];
  breaksArr = b ? JSON.parse(b.value) : [];
}
async function saveEmployees(){ try{ await window.storage.set('employees', JSON.stringify(employees), true); }catch(e){ console.error(e); } }
async function saveAttendance(){ try{ await window.storage.set('attendance', JSON.stringify(attendance), true); }catch(e){ console.error(e); } }
async function saveOvertime(){ try{ await window.storage.set('overtime', JSON.stringify(overtime), true); }catch(e){ console.error(e); } }
async function saveBreaks(){ try{ await window.storage.set('breaks_records', JSON.stringify(breaksArr), true); }catch(e){ console.error(e); } }

/* ===================== Record logic ===================== */
function todaysAttendance(code,date){ return attendance.find(r=>r.code===code && r.date===date); }
function todaysOvertime(code,date){ return overtime.find(r=>r.code===code && r.date===date); }
function todaysBreak(code,date){ return breaksArr.find(r=>r.code===code && r.date===date); }
/* "Open" = started but not yet ended, regardless of calendar date — needed so a session
   that crosses midnight (started before 12:00 AM, ended after) can still be found and closed. */
function openAttendanceFor(code){ for(let i=attendance.length-1;i>=0;i--){ if(attendance[i].code===code && !attendance[i].checkOut) return attendance[i]; } return null; }
function openOvertimeFor(code){ for(let i=overtime.length-1;i>=0;i--){ if(overtime[i].code===code && !overtime[i].timeOut) return overtime[i]; } return null; }
function openBreakFor(code){ for(let i=breaksArr.length-1;i>=0;i--){ if(breaksArr[i].code===code && !breaksArr[i].end) return breaksArr[i]; } return null; }

async function checkIn(){
  const date=isoDate(new Date());
  const openRec=openAttendanceFor(currentUser.code);
  if(openRec){ alert('عندك تسجيل حضور لسه مفتوح من '+dispDate(openRec.date)+' — سجل الانصراف الأول قبل تسجيل حضور جديد.'); return; }
  if(todaysAttendance(currentUser.code,date)) return;
  attendance.push({id:uid(),code:currentUser.code,name:currentUser.name,date,day:dayNameOf(date),checkIn:nowTimeStr(),checkOut:null,minutes:null});
  await saveAttendance();
  ui.lastTicket={head:'تم تسجيل الحضور',lines:['الاسم: '+currentUser.name,'الكود: '+currentUser.code,'الوقت: '+shortTime(nowTimeStr()),'التاريخ: '+dispDate(date)]};
  render();
}
async function checkOut(){
  const rec=openAttendanceFor(currentUser.code);
  if(!rec) return;
  rec.checkOut=nowTimeStr();
  rec.minutes=minutesBetween(rec.date,rec.checkIn,rec.checkOut);
  await saveAttendance();
  ui.lastTicket={head:'تم تسجيل الانصراف',lines:['الاسم: '+currentUser.name,'الكود: '+currentUser.code,'الوقت: '+shortTime(rec.checkOut),'إجمالي الساعات: '+fmtHM(rec.minutes)]};
  render();
}
async function startOvertime(){
  const date=isoDate(new Date());
  const openRec=openOvertimeFor(currentUser.code);
  if(openRec){ alert('عندك إضافي لسه مفتوح من '+dispDate(openRec.date)+' — سجل إنهاء الإضافي الأول.'); return; }
  if(todaysOvertime(currentUser.code,date)) return;
  overtime.push({id:uid(),code:currentUser.code,name:currentUser.name,date,day:dayNameOf(date),timeIn:nowTimeStr(),timeOut:null,minutes:null});
  await saveOvertime();
  ui.lastTicket={head:'بدء الإضافي الشهري',lines:['الاسم: '+currentUser.name,'الكود: '+currentUser.code,'الوقت: '+shortTime(nowTimeStr())]};
  render();
}
async function endOvertime(){
  const rec=openOvertimeFor(currentUser.code);
  if(!rec) return;
  rec.timeOut=nowTimeStr();
  rec.minutes=minutesBetween(rec.date,rec.timeIn,rec.timeOut);
  await saveOvertime();
  ui.lastTicket={head:'إنهاء الإضافي الشهري',lines:['الاسم: '+currentUser.name,'الكود: '+currentUser.code,'الوقت: '+shortTime(rec.timeOut),'مدة الإضافي: '+fmtHM(rec.minutes)]};
  render();
}
async function startBreak(){
  const date=isoDate(new Date());
  const openRec=openBreakFor(currentUser.code);
  if(openRec){ alert('عندك راحة لسه مفتوحة من '+dispDate(openRec.date)+' — سجل إنهاء الراحة الأول.'); return; }
  if(todaysBreak(currentUser.code,date)) return;
  breaksArr.push({id:uid(),code:currentUser.code,name:currentUser.name,date,day:dayNameOf(date),start:nowTimeStr(),end:null,minutes:null});
  await saveBreaks();
  ui.lastTicket={head:'بدء الراحة',lines:['الاسم: '+currentUser.name,'الكود: '+currentUser.code,'الوقت: '+shortTime(nowTimeStr())]};
  render();
}
async function endBreak(){
  const rec=openBreakFor(currentUser.code);
  if(!rec) return;
  rec.end=nowTimeStr();
  rec.minutes=minutesBetween(rec.date,rec.start,rec.end);
  await saveBreaks();
  ui.lastTicket={head:'انتهاء الراحة',lines:['الاسم: '+currentUser.name,'الكود: '+currentUser.code,'الوقت: '+shortTime(rec.end),'مدة الراحة: '+fmtHM(rec.minutes)]};
  render();
}

/* ===================== Auth ===================== */
async function doLogin(){
  const code=document.getElementById('loginCode').value.trim();
  const pass=document.getElementById('loginPass').value;
  if(!code||!pass){ ui.loginError='من فضلك أدخل الكود وكلمة المرور'; render(); return; }
  const emp=employees.find(e=>e.code===code && e.password===pass);
  if(!emp){ ui.loginError='الكود أو كلمة المرور غير صحيحة'; render(); return; }
  currentUser={code:emp.code,name:emp.name};
  ui.screen='dashboard'; ui.loginError=''; ui.lastTicket=null;
  render();
}
async function doRegister(){
  const code=document.getElementById('regCode').value.trim();
  const name=document.getElementById('regName').value.trim();
  const pass=document.getElementById('regPass').value;
  const pass2=document.getElementById('regPass2').value;
  if(!code||!name||!pass){ ui.loginError='من فضلك أكمل كل البيانات'; render(); return; }
  if(pass!==pass2){ ui.loginError='كلمة المرور غير متطابقة'; render(); return; }
  if(employees.find(e=>e.code===code)){ ui.loginError='هذا الكود مسجل بالفعل'; render(); return; }
  employees.push({code,name,password:pass,permissions:{attendance:true,overtime:true,breaks:true}});
  await saveEmployees();
  currentUser={code,name};
  ui.screen='dashboard'; ui.loginError=''; ui.lastTicket=null;
  render();
}
async function doAdminLogin(){
  const pass=document.getElementById('adminPass').value;
  if(pass!==ADMIN_PASSWORD){ ui.loginError='كلمة مرور المدير غير صحيحة'; render(); return; }
  currentUser={code:'admin',name:ADMIN_NAME,isAdmin:true};
  ui.screen='dashboard'; ui.loginError=''; ui.lastTicket=null;
  render();
}
function logout(){ currentUser=null; ui.screen='login'; ui.loginMode='login'; ui.loginError=''; render(); }
function hasPermission(section){
  if(!currentUser || currentUser.isAdmin) return true;
  const emp=employees.find(e=>e.code===currentUser.code);
  if(!emp || !emp.permissions) return true;
  return emp.permissions[section]!==false;
}
function togglePermission(code,key){
  const emp=employees.find(e=>e.code===code);
  if(!emp) return;
  if(!emp.permissions) emp.permissions={attendance:true,overtime:true,breaks:true};
  emp.permissions[key] = !(emp.permissions[key]!==false);
  saveEmployees();
  render();
}
function adminEditEmployee(code){
  const emp=employees.find(e=>e.code===code);
  if(!emp) return;
  const row=document.querySelector(`.admin-row[data-emp="${code}"]`);
  if(!row) return;
  const newName=row.querySelector('.emp-name-input').value.trim();
  const newPass=row.querySelector('.emp-pass-input').value;
  if(newName) emp.name=newName;
  if(newPass) emp.password=newPass;
  saveEmployees();
  alert('تم حفظ بيانات العامل بنجاح');
  render();
}
function goSection(s){
  ui.lastTicket=null;
  if(s==='admin'){
    ui.screen='admin';
    if(!ui.admin) ui.admin={type:'attendance',date:isoDate(new Date())};
    render();
    return;
  }
  if(s==='permissions'){
    ui.screen='permissions';
    render();
    return;
  }
  if(s==='directory'){
    ui.screen='directory';
    render();
    return;
  }
  if(s==='punctuality'){
    ui.screen='punctuality';
    if(!ui.punct) ui.punct={period:'day',date:isoDate(new Date())};
    render();
    return;
  }
  if(s==='stats'){
    ui.screen='stats';
    if(!ui.stats) ui.stats={period:'day',date:isoDate(new Date())};
    render();
    return;
  }
  if((s==='attendance'||s==='overtime'||s==='breaks') && !hasPermission(s)){
    alert('هذا القسم مغلق حاليًا من الإدارة. تواصل مع '+ADMIN_NAME+'.');
    return;
  }
  ui.section=s; ui.screen='section';
  if(s==='reports' && !ui.report){ ui.report={type:'attendance',period:'day',date:isoDate(new Date())}; }
  render();
}
function goDashboard(){ ui.screen='dashboard'; ui.lastTicket=null; render(); }

/* ===================== Reports ===================== */
const TYPE_CONFIG={
  attendance:{label:'دخول وانصراف', inLabel:'الحضور', outLabel:'الانصراف',
    getIn:r=>r.checkIn, getOut:r=>r.checkOut, setIn:(r,v)=>r.checkIn=v, setOut:(r,v)=>r.checkOut=v, source:()=>attendance, saveFn:()=>saveAttendance()},
  overtime:{label:'الإضافي الشهري', inLabel:'البداية', outLabel:'النهاية',
    getIn:r=>r.timeIn, getOut:r=>r.timeOut, setIn:(r,v)=>r.timeIn=v, setOut:(r,v)=>r.timeOut=v, source:()=>overtime, saveFn:()=>saveOvertime()},
  breaks:{label:'الراحات', inLabel:'البداية', outLabel:'النهاية',
    getIn:r=>r.start, getOut:r=>r.end, setIn:(r,v)=>r.start=v, setOut:(r,v)=>r.end=v, source:()=>breaksArr, saveFn:()=>saveBreaks()},
};

/* ===================== Admin ===================== */
const ADMIN_PASSWORD='GBI@2026'; // كلمة مرور م/أحمد ربيع - غيّرها من هنا وقتما تحب
const ADMIN_NAME='م/أحمد ربيع';
function weekRange(refIso){
  const ref=new Date(refIso+'T00:00:00');
  const diff=(ref.getDay()-6+7)%7; // Saturday = start of week
  const sat=new Date(ref); sat.setDate(ref.getDate()-diff);
  const fri=new Date(sat); fri.setDate(sat.getDate()+6);
  return {sat,fri};
}
function inPeriod(dateIso,period,refIso){
  if(period==='day') return dateIso===refIso;
  if(period==='month') return dateIso.slice(0,7)===refIso.slice(0,7);
  if(period==='week'){
    const {sat,fri}=weekRange(refIso);
    const d=new Date(dateIso+'T00:00:00');
    return d>=sat && d<=fri;
  }
  return false;
}
const REPORT_TITLE={
  attendance:'تقرير الحضور والانصراف',
  overtime:'أمر تشغيل ساعات إضافية',
  breaks:'أمر تشغيل راحات',
};
function periodLabelFor(state){
  const p=state.period, ref=state.date;
  if(p==='day') return dispDate(ref)+' ('+dayNameOf(ref)+')';
  if(p==='month'){ const [y,m]=ref.split('-'); return 'شهر '+m+'/'+y; }
  if(p==='week'){ const {sat,fri}=weekRange(ref); return 'من '+dispDate(isoDate(sat))+' إلى '+dispDate(isoDate(fri)); }
}
function periodLabel(){ return periodLabelFor(ui.report); }

function exportWord(){
  const area=document.getElementById('printArea');
  if(!area) return;
  const cfg=TYPE_CONFIG[ui.report.type];
  const html = `<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="utf-8">
    <style>
      body{font-family:Tahoma,Arial,sans-serif;}
      h2,h3,h4{font-family:Tahoma,Arial,sans-serif;}
      table{width:100%;border-collapse:collapse;margin-top:8px;}
      th,td{border:1px solid #999;padding:6px;text-align:center;font-size:12px;}
      th{background:#eee;}
      tfoot td{background:#f4dfae;font-weight:bold;}
      .grand{background:#f4dfae;padding:10px;font-weight:bold;text-align:center;margin-top:10px;}
    </style></head><body>
    <h2 style="text-align:center;">GBI — ${REPORT_TITLE[ui.report.type]}</h2>
    <p style="text-align:center;">${periodLabel()}</p>
    ${area.innerHTML}
    <p style="text-align:center;font-size:11px;color:#777;margin-top:20px;">إعداد وتصميم ${ADMIN_NAME}</p>
    </body></html>`;
  const blob=new Blob(['\ufeff', html], {type:'application/msword'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='تقرير-GBI-'+cfg.label+'-'+ui.report.date+'.doc';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ===================== Render: Login ===================== */
function renderLogin(){
  const mode=ui.loginMode;
  return `
  <div class="plate"><span class="rivet-l"></span><span class="rivet-r"></span>
    <div class="brand brand-center">
      <div class="brand-mark">GBI</div>
      <div class="brand-sub">نظام تسجيل حضور المصنع</div>
      <div class="credit-line">إعداد وتصميم ${ADMIN_NAME}</div>
    </div>
  </div>
  ${installAvailable? `<button class="btn btn-ghost" style="margin-top:10px;" data-action="install-app">📲 تثبيت التطبيق على الشاشة الرئيسية</button>` : ''}
  <div class="card">
    <div class="tabs">
      <button class="tab ${mode==='login'?'active':''}" data-action="show-login">تسجيل الدخول</button>
      <button class="tab ${mode==='register'?'active':''}" data-action="show-register">عامل جديد</button>
      <button class="tab ${mode==='admin'?'active':''}" data-action="show-admin-login">${ADMIN_NAME}</button>
    </div>

function adminAddRecord(){
  const cfg=TYPE_CONFIG[ui.admin.type];
  const code=document.getElementById('addEmp').value;
  const date=document.getElementById('addDate').value;
  const tin=document.getElementById('addIn').value;
  const tout=document.getElementById('addOut').value;
  if(!code||!date||!tin){ alert('لازم تختار العامل والتاريخ ووقت البداية على الأقل'); return; }
  const emp=employees.find(e=>e.code===code);
  const rec={id:uid(), code, name:emp?emp.name:code, date, day:dayNameOf(date)};
  cfg.setIn(rec, tin+':00');
  if(tout){ cfg.setOut(rec, tout+':00'); rec.minutes=minutesBetween(date, tin+':00', tout+':00'); } else { cfg.setOut(rec,null); rec.minutes=null; }
  cfg.source().push(rec);
  cfg.saveFn();
  render();
}
function adminSaveRow(id){
  const cfg=TYPE_CONFIG[ui.admin.type];
  const rec=cfg.source().find(r=>r.id===id);
  if(!rec) return;
  const row=document.querySelector(`.admin-row[data-id="${id}"]`);
  const date=row.querySelector('.adm-date').value;
  const tin=row.querySelector('.adm-in').value;
  const tout=row.querySelector('.adm-out').value;
  if(date) { rec.date=date; rec.day=dayNameOf(date); }
  if(tin) cfg.setIn(rec, tin+':00'); 
  if(tout){ cfg.setOut(rec, tout+':00'); rec.minutes=minutesBetween(rec.date, cfg.getIn(rec), cfg.getOut(rec)); }
  else { cfg.setOut(rec, null); rec.minutes=null; }
  cfg.saveFn();
  render();
}
function adminDeleteRow(id){
  if(!confirm('متأكد إنك عاوز تحذف السجل ده؟')) return;
  const cfg=TYPE_CONFIG[ui.admin.type];
  const arr=cfg.source();
  const idx=arr.findIndex(r=>r.id===id);
  if(idx>-1) arr.splice(idx,1);
  cfg.saveFn();
  render();
}

  <div class="card"><div class="empty-note" style="padding:0;">افتح/اقفل أي قسم، أو عدّل اسم/كلمة مرور أي عامل مباشرة</div></div>
  ${rows}`;
}

/* ---- Punctuality (official 8:00 - 17:00 hours) report — separate from daily/weekly/monthly reports ---- */
function renderPunctualityReport(){
  const recs=attendance.filter(r=>inPeriod(r.date,ui.punct.period,ui.punct.date));
  recs.sort((a,b)=> a.date===b.date ? (a.checkIn||'').localeCompare(b.checkIn||'') : a.date.localeCompare(b.date));

  const groups={};
  recs.forEach(r=>{
    const p=punctualityFor(r);
    if(!groups[r.code]) groups[r.code]={name:r.name,rows:[],lateTotal:0,earlyTotal:0,shortTotal:0};
    groups[r.code].rows.push(Object.assign({},r,{_p:p}));
    groups[r.code].lateTotal+=p.late||0;
    groups[r.code].earlyTotal+=p.early||0;
    groups[r.code].shortTotal+=p.shortage||0;
  });
  const codes=Object.keys(groups).sort((a,b)=>groups[a].name.localeCompare(groups[b].name,'ar'));
  const grandLate=codes.reduce((s,c)=>s+groups[c].lateTotal,0);
  const grandEarly=codes.reduce((s,c)=>s+groups[c].earlyTotal,0);
  const grandShort=codes.reduce((s,c)=>s+groups[c].shortTotal,0);

  const groupsHtml = codes.length ? codes.map(code=>{
    const g=groups[code];
    return `<div class="report-group">
      <h4><span>⏱️ ${g.name} <span class="mono" style="opacity:.7;font-size:11px;">(${code})</span></span><span class="mono">${fmtHM(g.shortTotal)} نقص</span></h4>
      <div class="scroll-x"><table class="wide7"><thead><tr><th>التاريخ</th><th>اليوم</th><th class="mono">الحضور</th><th class="mono">الانصراف</th><th class="mono">التأخير</th><th class="mono">مبكر</th><th class="mono">النقص</th></tr></thead>
      <tbody>${g.rows.map(r=>`<tr>
        <td>${dispDate(r.date)}</td><td>${r.day}</td>
        <td class="mono">${shortTime(r.checkIn)}</td><td class="mono">${shortTime(r.checkOut)}</td>
        <td class="mono ${r._p.late>0?'flag-bad':''}">${r._p.late!=null?fmtHM(r._p.late):'--:--'}</td>
        <td class="mono ${r._p.early>0?'flag-bad':''}">${r._p.early!=null?fmtHM(r._p.early):'--:--'}</td>
        <td class="mono ${r._p.shortage>0?'flag-bad':''}">${r._p.shortage!=null?fmtHM(r._p.shortage):'--:--'}</td>
      </tr>`).join('')}</tbody>
      <tfoot><tr><td colspan="4">إجمالي ${g.name}</td><td class="mono">${fmtHM(g.lateTotal)}</td><td class="mono">${fmtHM(g.earlyTotal)}</td><td class="mono">${fmtHM(g.shortTotal)}</td></tr></tfoot>
      </table></div>
    </div>`;
  }).join('') : `<div class="empty-note">لا توجد سجلات حضور في هذه الفترة</div>`;

  return sectionHeaderPlain('الالتزام بمواعيد العمل الرسمية') + `
  <div class="card no-print">
    <div class="field"><label>الفترة</label>
      <div class="tabs">
        <button class="tab ${ui.punct.period==='day'?'active':''}" data-action="punct-period" data-value="day">يومي</button>
        <button class="tab ${ui.punct.period==='week'?'active':''}" data-action="punct-period" data-value="week">أسبوعي</button>
        <button class="tab ${ui.punct.period==='month'?'active':''}" data-action="punct-period" data-value="month">شهري</button>
      </div>
    </div>
    <div class="field"><label>التاريخ المرجعي</label><input type="date" data-field="punct-date" value="${ui.punct.date}"></div>
    <div class="legend">⏰ التأخير = الحضور بعد 08:00 &nbsp;|&nbsp; 🚪 مبكر = الانصراف قبل 17:00 &nbsp;|&nbsp; 📉 النقص = أقل من 9 ساعات عمل</div>
    <div class="row" style="margin-top:10px;">
      <button class="btn btn-ghost" data-action="print">🖨 طباعة / حفظ PDF</button>
    </div>
  </div>
  <div id="printArea">
    <div class="letterhead">
      <div class="lh-brand">GBI</div>
      <h2 class="lh-title">تقرير الالتزام بمواعيد العمل الرسمية</h2>
      <div class="lh-sub">دوام العمل الرسمي: 08:00 ص — 05:00 م &nbsp;|&nbsp; ${periodLabelFor(ui.punct)}</div>

/* ---- Punctuality drill-down: who contributed to a given total ---- */
function renderPunctDetail(){
  const type=ui.punctDetail.type;
  const recs=attendance.filter(r=>inPeriod(r.date,ui.punct.period,ui.punct.date));
  const byCode={};
  recs.forEach(r=>{
    const p=punctualityFor(r);
    const val = type==='late'?p.late : type==='early'?p.early : p.shortage;
    if(!val) return;
    if(!byCode[r.code]) byCode[r.code]={name:r.name,total:0};
    byCode[r.code].total+=val;
  });
  const list=Object.values(byCode).sort((a,b)=>b.total-a.total);
  const title = type==='late'?'تفاصيل التأخير لكل العاملين' : type==='early'?'تفاصيل الانصراف المبكر لكل العاملين' : 'تفاصيل النقص عن الدوام الرسمي';
  return sectionHeaderBackTo(title,'punctuality') + `
  <div class="card no-print"><div class="empty-note" style="padding:0;">${periodLabelFor(ui.punct)}</div></div>
  <div class="card">
    ${list.length? `<div class="table-wrap"><table><thead><tr><th>الاسم</th><th class="mono">الإجمالي</th></tr></thead><tbody>${list.map(x=>`<tr><td>${x.name}</td><td class="mono flag-bad">${fmtHM(x.total)}</td></tr>`).join('')}</tbody></table></div>` : `<div class="empty-note">لا يوجد تجاوزات في هذه الفترة 🎉</div>`}
  </div>`;
}

/* ---- Stats dashboard ---- */

  const presentCodes=new Set(recsAtt.filter(r=>r.checkIn).map(r=>r.code));
  const presentCount=presentCodes.size;
  const lateCount=recsAtt.filter(r=>r.checkIn && timeToMinutesOfDay(r.checkIn)>STANDARD_IN_MIN).length;
  const totalEmployees=employees.length;
  const absentCount=Math.max(0, totalEmployees-presentCount);
  const otTotal=recsOt.filter(r=>r.minutes!=null).reduce((s,r)=>s+r.minutes,0);

  const hoursByCode={};
  recsAtt.filter(r=>r.minutes!=null).forEach(r=>{ hoursByCode[r.code]=(hoursByCode[r.code]||0)+r.minutes; });

    {icon:'👥',value:totalEmployees,label:'إجمالي العاملين المسجلين',type:'total'},

  <div class="card no-print">
    <div class="field"><label>الفترة</label>
      <div class="tabs">
        <button class="tab ${ui.stats.period==='day'?'active':''}" data-action="stats-period" data-value="day">يومي</button>
        <button class="tab ${ui.stats.period==='week'?'active':''}" data-action="stats-period" data-value="week">أسبوعي</button>
        <button class="tab ${ui.stats.period==='month'?'active':''}" data-action="stats-period" data-value="month">شهري</button>
      </div>
    </div>
    <div class="field"><label>التاريخ المرجعي</label><input type="date" data-field="stats-date" value="${ui.stats.date}"></div>
    <div class="row" style="margin-top:10px;">
      <button class="btn btn-ghost" data-action="print">🖨 طباعة / حفظ PDF</button>
    </div>
  </div>
  <div id="printArea">
    <div class="letterhead">
      <div class="lh-brand">GBI</div>
      <h2 class="lh-title">تقرير الإحصائيات العام</h2>
      <div class="lh-sub">${periodLabelFor(ui.stats)}</div>
      <div class="lh-date">تاريخ الطباعة: ${dispDate(isoDate(new Date()))} — ${ADMIN_NAME}</div>
    </div>
    <div class="stat-grid">
      ${cards.map(c=>`<div class="stat-card ${c.type?'clickable':''}" ${c.type?`data-action="stat-detail" data-type="${c.type}"`:''}>
        <div class="stat-icon">${c.icon}</div><div class="stat-value ${c.mono?'mono':''}">${c.value}</div><div class="stat-label">${c.label}</div>

/* ---- Stat detail drill-down ---- */
function renderStatDetail(){
  const type=ui.statDetail.type;
  const recsAtt=attendance.filter(r=>inPeriod(r.date,ui.stats.period,ui.stats.date));
  const recsOt=overtime.filter(r=>inPeriod(r.date,ui.stats.period,ui.stats.date));
  let title='', tableHtml='', emptyMsg='لا توجد بيانات';

  if(type==='present'){
    title='الحاضرون خلال الفترة';
    const list=recsAtt.filter(r=>r.checkIn).sort((a,b)=> a.date===b.date? a.name.localeCompare(b.name,'ar') : a.date.localeCompare(b.date));
    tableHtml = list.length ? `<div class="table-wrap"><table class="wide7"><thead><tr><th>التاريخ</th><th>اليوم</th><th>الاسم</th><th class="mono">الكود</th><th class="mono">الحضور</th><th class="mono">الانصراف</th></tr></thead><tbody>
      ${list.map(r=>`<tr><td>${dispDate(r.date)}</td><td>${r.day}</td><td>${r.name}</td><td class="mono">${r.code}</td><td class="mono">${shortTime(r.checkIn)}</td><td class="mono">${r.checkOut?shortTime(r.checkOut):'لسه في العمل'}</td></tr>`).join('')}
    </tbody></table></div>` : '';
    emptyMsg='لا يوجد حاضرين خلال هذه الفترة بعد';
  } else if(type==='absent'){
    title='لم يحضروا خلال الفترة (تقديري)';
    const presentCodes=new Set(recsAtt.filter(r=>r.checkIn).map(r=>r.code));
    const list=employees.filter(e=>!presentCodes.has(e.code)).sort((a,b)=>a.name.localeCompare(b.name,'ar'));
    tableHtml = list.length ? `<div class="table-wrap"><table><thead><tr><th>الاسم</th><th class="mono">الكود</th></tr></thead><tbody>
      ${list.map(e=>`<tr><td>${e.name}</td><td class="mono">${e.code}</td></tr>`).join('')}
    </tbody></table></div>` : '';
    emptyMsg='كل العاملين حضروا خلال هذه الفترة 🎉';
  } else if(type==='late'){
    title='المتأخرون خلال الفترة';
    const list=recsAtt.filter(r=>r.checkIn && timeToMinutesOfDay(r.checkIn)>STANDARD_IN_MIN)
      .sort((a,b)=> a.date===b.date? a.name.localeCompare(b.name,'ar') : a.date.localeCompare(b.date));
    tableHtml = list.length ? `<div class="table-wrap"><table class="wide7"><thead><tr><th>التاريخ</th><th>اليوم</th><th>الاسم</th><th class="mono">الكود</th><th class="mono">الحضور</th><th class="mono">التأخير</th></tr></thead><tbody>
      ${list.map(r=>`<tr><td>${dispDate(r.date)}</td><td>${r.day}</td><td>${r.name}</td><td class="mono">${r.code}</td><td class="mono">${shortTime(r.checkIn)}</td><td class="mono flag-bad">${fmtHM(timeToMinutesOfDay(r.checkIn)-STANDARD_IN_MIN)}</td></tr>`).join('')}
    </tbody></table></div>` : '';
    emptyMsg='لا يوجد متأخرين خلال هذه الفترة 🎉';
  } else if(type==='total'){
    title='كل العاملين المسجلين';
    const list=employees.slice().sort((a,b)=>a.name.localeCompare(b.name,'ar'));
    tableHtml = list.length ? `<div class="table-wrap"><table><thead><tr><th>الاسم</th><th class="mono">الكود</th></tr></thead><tbody>
      ${list.map(e=>`<tr><td>${e.name}</td><td class="mono">${e.code}</td></tr>`).join('')}
    </tbody></table></div>` : '';
  } else if(type==='overtime'){
    title='ساعات الإضافي خلال الفترة لكل عامل';
    const byCode={};
    recsOt.filter(r=>r.minutes!=null).forEach(r=>{
      if(!byCode[r.code]) byCode[r.code]={name:r.name,total:0};
      byCode[r.code].total+=r.minutes;
    });
    const list=Object.values(byCode).sort((a,b)=>b.total-a.total);
    tableHtml = list.length ? `<div class="table-wrap"><table><thead><tr><th>الاسم</th><th class="mono">إجمالي الإضافي</th></tr></thead><tbody>
      ${list.map(x=>`<tr><td>${x.name}</td><td class="mono">${fmtHM(x.total)}</td></tr>`).join('')}
    </tbody></table></div>` : '';
    emptyMsg='لا يوجد إضافي مسجل خلال هذه الفترة';
  }

  return sectionHeaderBackTo(title,'stats') + `
  <div class="card">
    ${tableHtml || `<div class="empty-note">${emptyMsg}</div>`}
  </div>`;
}

/* ---- Full data export to Excel (.xlsx) — separate from the periodic reports ---- */
function exportAllExcel(){
  if(typeof XLSX==='undefined'){ alert('تعذر تحميل مكتبة Excel — تأكد من الاتصال بالإنترنت وحاول مرة أخرى.'); return; }
  const wb=XLSX.utils.book_new();
  const mapAtt=attendance.map(r=>({'الاسم':r.name,'الكود':r.code,'التاريخ':r.date,'اليوم':r.day,'الحضور':shortTime(r.checkIn),'الانصراف':shortTime(r.checkOut),'الساعات':fmtHM(r.minutes)}));
  const mapOt=overtime.map(r=>({'الاسم':r.name,'الكود':r.code,'التاريخ':r.date,'اليوم':r.day,'البداية':shortTime(r.timeIn),'النهاية':shortTime(r.timeOut),'المدة':fmtHM(r.minutes)}));
  const mapBr=breaksArr.map(r=>({'الاسم':r.name,'الكود':r.code,'التاريخ':r.date,'اليوم':r.day,'البداية':shortTime(r.start),'النهاية':shortTime(r.end),'المدة':fmtHM(r.minutes)}));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(mapAtt.length?mapAtt:[{'لا توجد بيانات':''}]), 'دخول وانصراف');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(mapOt.length?mapOt:[{'لا توجد بيانات':''}]), 'الإضافي الشهري');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(mapBr.length?mapBr:[{'لا توجد بيانات':''}]), 'الراحات');
  XLSX.writeFile(wb, 'GBI-جميع-البيانات-'+isoDate(new Date())+'.xlsx');
}

const FOOTER_HTML = `<div class="footer-credit no-print">GBI © إعداد وتصميم ${ADMIN_NAME}</div>`;
function render(){
  const app=document.getElementById('app');
  let content='';
  if(ui.screen==='login' || !currentUser){
    content = renderLogin();
  } else if(ui.screen==='dashboard'){
    content = renderDashboard();
  } else if(ui.screen==='admin'){
    content = renderAdminPanel();
  } else if(ui.screen==='permissions'){
    content = renderPermissionsPanel();
  } else if(ui.screen==='directory'){
    content = renderEmployeeDirectory();
  } else if(ui.screen==='punctuality'){
    content = renderPunctualityReport();
  } else if(ui.screen==='stats'){
    content = renderStatsPanel();
  } else if(ui.screen==='stat-detail'){
    content = renderStatDetail();
  } else if(ui.screen==='punct-detail'){
    content = renderPunctDetail();

    if(ui.section==='attendance') content = renderAttendanceSection();
    else if(ui.section==='overtime') content = renderOvertimeSection();
    else if(ui.section==='breaks') content = renderBreaksSection();
    else if(ui.section==='reports') content = renderReportsSection();
  }
  app.innerHTML = content + FOOTER_HTML;
  if(ui.screen==='dashboard') startClock();
}
function startClock(){
  const el=document.getElementById('liveClock');
  if(!el) return;
  const tick=()=>{ const e=document.getElementById('liveClock'); if(e){ const d=new Date(); e.textContent=pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds()); } };
  tick();
}
setInterval(()=>{ const e=document.getElementById('liveClock'); if(e){ const d=new Date(); e.textContent=pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds()); } },1000);

/* ===================== Events ===================== */
document.getElementById('app').addEventListener('click', (e)=>{
  const el=e.target.closest('[data-action]');
  if(!el) return;
  const action=el.dataset.action;
  if(action==='show-login'){ ui.loginMode='login'; ui.loginError=''; render(); }
  else if(action==='show-register'){ ui.loginMode='register'; ui.loginError=''; render(); }
  else if(action==='show-admin-login'){ ui.loginMode='admin'; ui.loginError=''; render(); }
  else if(action==='login') doLogin();
  else if(action==='register') doRegister();
  else if(action==='admin-login') doAdminLogin();
  else if(action==='logout') logout();
  else if(action==='goto') goSection(el.dataset.section);
  else if(action==='back') goDashboard();
  else if(action==='check-in') checkIn();
  else if(action==='check-out') checkOut();
  else if(action==='ot-start') startOvertime();
  else if(action==='ot-end') endOvertime();
  else if(action==='br-start') startBreak();
  else if(action==='br-end') endBreak();
  else if(action==='print') window.print();
  else if(action==='export-word') exportWord();
  else if(action==='rep-period'){ ui.report.period=el.dataset.value; render(); }
  else if(action==='admin-type'){ ui.admin.type=el.dataset.value; render(); }
  else if(action==='admin-add') adminAddRecord();
  else if(action==='admin-save') adminSaveRow(el.dataset.id);
  else if(action==='admin-delete') adminDeleteRow(el.dataset.id);
  else if(action==='toggle-perm') togglePermission(el.dataset.code, el.dataset.key);
  else if(action==='admin-edit-emp') adminEditEmployee(el.dataset.code);
  else if(action==='punct-period'){ ui.punct.period=el.dataset.value; render(); }
  else if(action==='stats-period'){ ui.stats.period=el.dataset.value; render(); }
  else if(action==='export-all-excel') exportAllExcel();
  else if(action==='install-app') installApp();
  else if(action==='stat-detail'){ ui.statDetail={type:el.dataset.type}; ui.screen='stat-detail'; render(); }
  else if(action==='punct-detail'){ ui.punctDetail={type:el.dataset.type}; ui.screen='punct-detail'; render(); }
  else if(action==='back-to'){ ui.screen=el.dataset.target; render(); }
});
document.getElementById('app').addEventListener('change', (e)=>{
  const el=e.target.closest('[data-field]');
  if(!el) return;
  const field=el.dataset.field;
  if(field==='admin-date'){ ui.admin.date=el.value; render(); }
  else if(field==='punct-date'){ ui.punct.date=el.value; render(); }
  else if(field==='stats-date'){ ui.stats.date=el.value; render(); }
  else { ui.report[field]=el.value; render(); }
});

/* ===================== Init ===================== */
(async function init(){
  document.getElementById('app').innerHTML = `<div class="card"><div class="empty-note">جارٍ التحميل...</div></div>`;
  await loadData();
  render();
})();
</script>
